{border-top:0}.row.me{background:var(--soft);border-radius:12px;padding:0 7px;border:1px solid #b4d5c5}.row .points{font-weight:700}.next-target{border-left:3px solid var(--teal);padding-left:10px;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--soft);padding:12px;border-radius:15px}.stat b{display:block;font-size:26px}.stat span{font-size:14px;color:var(--muted)}.count{text-align:center;min-height:460px;display:flex;flex-direction:column;align-items:center;justify-content:center}.count strong{font-size:90px;color:var(--teal)}.count .hat{width:120px;height:120px}.game{display:grid;grid-template-rows:45px 27px minmax(140px,1fr) auto auto 53px;gap:10px;height:calc(100svh - 110px);min-height:579px}.hud{display:flex;justify-content:space-between;align-items:center}.hud strong{font-size:18px}.clock{font-variant-numeric:tabular-nums}.timer{height:6px;border-radius:5px;background:#d3ddd6;overflow:hidden}.timer div{height:100%;background:var(--teal);width:100%;transition:width .1s linear}.question{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:12px}.question img{object-fit:contain;width:100%;height:calc(100% - 54px);max-height:220px;min-height:70px}.question figcaption{font-size:18px;font-weight:700;margin-top:8px;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{min-height:64px;text-align:left;padding:8px 10px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px}.letter{font-size:13px;border:1px solid #bdcec5;border-radius:7px;padding:3px 5px;flex:none}.answer.right{border:2px solid var(--ok);background:#e6f3e9;color:var(--ok)}.answer.wrong{border:2px solid var(--bad);background:#fff1eb;color:var(--bad)}.answer:disabled{opacity:1}.feedback{min-height:78px;padding:10px 12px;border-radius:15px;font-size:15px;background:var(--paper);border:1px solid var(--line)}.feedback strong{display:block}.feedback.good{border-color:#96c4a3}.feedback.bad{border-color:#d3a296}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.countdowns{font-size:13px;color:var(--muted)}.toast{position:fixed;z-index:9;top:70px;left:50%;transform:translateX(-50%);max-width:440px;width:calc(100% - 32px);padding:13px 16px;border:1px solid #b2ccb9;background:#fffef7;border-radius:17px;box-shadow:0 5px 20px #233f3225;pointer-events:none;font-weight:700;text-align:center}.result-top{text-align:center}.result-top .hat{height:85px;width:85px}.score{font-size:51px;line-height:1.15;font-weight:700;margin:7px 0}.score small{font-size:24px}.celebration{display:inline-block;margin:8px auto;background:#faf1d6;border:1px solid #d4b978;border-radius:12px;padding:8px 12px;font-weight:700;color:#6f4b13}.reward{background:#fffdf4}.badge{width:65px;height:65px;border-radius:50%;border:4px solid #b78c40;background:#fcf1cd;display:grid;place-items:center;font-size:32px;flex:none}.reward-preview{display:flex;justify-content:center;margin:20px 0}.apron{height:150px;width:130px;background:#08766e;border-radius:30px 30px 14px 14px;display:grid;place-items:center;border:5px solid #3b9b85;position:relative}.apron:before{content:'';position:absolute;top:-16px;width:50px;height:22px;border:6px solid #08766e;border-bottom:0;border-radius:20px 20px 0 0}.apron svg{width:50px;height:50px;stroke:white;fill:none;stroke-width:2}.confetti{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}.confetti i{position:absolute;top:-15px;width:7px;height:12px;background:var(--c);left:var(--x);animation:fall 1.5s ease-in forwards;animation-delay:var(--d)}@keyframes fall{to{transform:translateY(80svh) rotate(250deg);opacity:0}}dialog{padding:18px;width:calc(100% - 24px);max-width:430px;max-height:calc(100svh - 24px);border:1px solid var(--line);border-radius:22px;color:var(--ink);background:var(--paper)}dialog::backdrop{background:#163b395f}.modal-head{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}.modal-head h2{margin:0}.close{min-width:48px;padding:8px}.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:57px;border-bottom:1px solid var(--line)}.setting label{flex:1;padding:14px 0;cursor:pointer}.setting input{width:25px;height:25px;accent-color:var(--teal)}.sound-test{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}body.night{--bg:#142a26;--paper:#203b35;--ink:#f1f6ef;--muted:#baccc3;--teal:#66d1bd;--soft:#2a4b41;--line:#4a665a;--ok:#9edab0;--bad:#ffc0a9;background:#10231e}body.night .primary{color:#14362e}body.night .question{background:white;color:#203b37}body.night .answer.right{color:#164d32}body.night .answer.wrong{color:#80332e}body.night .toast{background:#203b35;color:#fff}body.night .celebration{color:#6f4b13}body.night .reward{background:var(--paper)}body.reduce *,body.reduce *:before,body.reduce *:after{animation:none!important;transition:none!important}@media(min-width:600px){body{padding:14px}.shell{min-height:calc(100svh - 28px);border-radius:24px;box-shadow:0 8px 35px #1b3e2c15}.game{height:calc(100svh - 138px)}}@media(max-height:740px){.shell{padding:8px 10px}.demo{margin:5px 0 8px}.game{height:calc(100svh - 92px);gap:7px;grid-template-rows:40px 22px minmax(110px,1fr) auto auto 48px;min-height:540px}.question img{max-height:180px}.answer{min-height:60px}.feedback{min-height:72px;font-size:14px}.question figcaption{font-size:17px}.result-top .hat{height:60px;width:60px}.score{font-size:40px}.stack{gap:9px}.card{padding:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.hero .hat{width:64px;height:64px}.hero h1{font-size:25px}.result-top{display:grid;grid-template-columns:54px 1fr;gap:4px 10px;text-align:left}.result-top .hat{grid-column:1;grid-row:1/4;width:54px;height:54px;align-self:center}.result-top .eyebrow{grid-column:2;margin:0}.result-top .score{grid-column:2;margin:0;font-size:36px}.result-top .pill{grid-column:2;justify-self:start}.result-top p.small{grid-column:1/-1;margin:2px 0}.result-top .celebration{grid-column:1/-1;justify-self:start;margin:3px 0;padding:5px 8px}@media(max-height:740px){.game{height:calc(100svh - 104px)}}
.sr{top:0;left:0}.result-top > p:not(.eyebrow){grid-column:1/-1;margin:3px 0}.result-top .hat{grid-row:1/4}.result-top p.small{margin:2px 0}.row{min-height:44px}</style></head><body><main class="shell"><header><button id="home" aria-label="Ana sayfa">⌂</button><strong id="pageTitle">Rekor denemesi</strong><button id="settings" aria-label="Ayarlar">⚙</button></header><p class="demo">Çalışan önizleme · 4 örnek soru · Gerçek kayıt yok</p><div id="app"></div></main><div id="live" class="sr" role="status" aria-live="polite"></div><dialog id="modal" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Ayarlar</h2><button class="close" id="close" aria-label="Kapat">✕</button></div><div id="modalBody"></div></dialog>

function countStep(){clearTimeout(countTimer);countTimer=setTimeout(()=>{if(screen!=='count')return;if(document.hidden||modal.open){countStep();return;}count--;if(count>0){renderCount();countStep();}else{Sound.effect('start');screen='question';title('Mutfak Araçları');renderQuestion();interval=setInterval(tick,100);}},750);}
function renderQuestion(){const q=QUESTIONS[game.i];game.locked=false;game.rem=20000;game.last=performance.now();app.innerHTML='<section class="game"><div class="hud"><strong>Soru '+(game.i+1)+' / 4</strong><span><b id="correctCount">'+game.correct+'</b> doğru</span><span class="clock" id="clock" aria-label="Kalan süre">20 sn</span></div><div><div class="timer" aria-hidden="true"><div id="timerFill"></div></div><span id="pauseNote" class="countdowns"></span></div><figure class="card question"><img src="'+q.image+'" alt="Adı sorulan mutfak aracının fotoğrafı"><figcaption>'+q.prompt+'</figcaption></figure><div class="choices" role="group" aria-label="Cevap seçenekleri">'+q.choices.map((c,i)=>'<button class="answer" data-answer="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(c)+'</span></button>').join('')+'</div><div id="feedback" class="feedback"><span class="muted">Görsele uygun adı seç.</span></div><div class="actions"><button id="listen">Soruyu dinle</button><button id="next" class="primary" disabled>Sonraki →</button></div></section>';app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));$('listen').onclick=()=>{if(!prefs.tts){prefs.tts=true;save();}speak(q.prompt+' '+q.choices.map((v,i)=>String.fromCharCode(65+i)+': '+v).join('. '));};$('next').onclick=next;announce('Soru '+(game.i+1)+'. '+q.prompt);}
function tick(){if(screen!=='question'||!game||game.locked)return;const now=performance.now(),dt=Math.min(250,Math.max(0,now-game.last));game.last=now;const stop=document.hidden||modal.open||speaking||paused;if($('pauseNote'))$('pauseNote').textContent=stop?'Süre duraklatıldı.':'';if(stop)return;game.time+=dt;game.rem=Math.max(0,game.rem-dt);$('clock').textContent=Math.ceil(game.rem/1000)+' sn';$('timerFill').style.width=game.rem/200+'%';if(game.rem<=0)answer(-1);}
function answer(index){if(screen!=='question'||!game||game.locked)return;cancelSpeech();Sound.init();game.locked=true;const q=QUESTIONS[game.i],right=index===q.correct;game.answers.push({qid:q.id,index,right});if(right)game.correct++;$('correctCount').textContent=game.correct;app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const n=+b.dataset.answer;if(n===q.correct){b.classList.add('right');b.insertAdjacentHTML('beforeend','<span aria-label="Doğru cevap">✓</span>');}if(n===index&&!right){b.classList.add('wrong');b.insertAdjacentHTML('beforeend','<span aria-label="Yanlış cevap">✕</span>');}});const fb=$('feedback');fb.className='feedback '+(right?'good':'bad');const head=right?'Doğru!':index<0?'Süre doldu.':'Bu cevap doğru değil.';fb.innerHTML='<strong>'+head+'</strong>'+esc(q.note);$('next').disabled=false;$('next').textContent=game.i===3?'Sonucumu gör →':'Sonraki →';Sound.effect(right?'correct':'wrong');announce(head+' '+q.note);if(right&&best&&game.correct>best.correct&&!game.personalShown){game.personalShown=true;toast('Yeni kişisel rekor!');}if(right&&game.correct>3&&!game.passedShown){game.passedShown=true;toast('Örnek sıralamada zirveye çıktın!');}}
function next(){if(!game?.locked)return;cancelSpeech();clearToasts();if(game.i===3){finish();return;}game.i++;renderQuestion();}
function fmt(ms){return (Math.round(ms/100)/10).toLocaleString('tr-TR',{minimumFractionDigits:1,maximumFractionDigits:1})+' sn';}
function compare(a,b){return b.correct-a.correct||a.time-b.time;}
function rankOf(rows,item){return 1+rows.filter(x=>compare(x,item)<0).length;}
function rowsHTML(rows,mine){const ordered=[...rows].sort(compare);return '<div aria-label="Örnek sıralama">'+ordered.map(r=>'<div class="row '+(r.me?'me':'')+'"><span>'+rankOf(ordered,r)+'.</span><span>'+esc(r.name)+(r.me?' (sen)':'')+'</span><span class="points">'+r.correct+' / 4</span></div>').join('')+'</div>';}
function finish(restore=false){if(!game||(game.ended&&!restore))return;game.ended=true;clearInterval(interval);cancelSpeech();clearToasts();screenToken++;screen='result';title('Sonucun');const old=restore?game.previousBest:best;if(!restore){game.previousBest=old;game.newBest=!old||game.correct>old.correct||(game.correct===old.correct&&game.time<old.time);if(game.newBest){best={correct:game.correct,time:Math.round(game.time)};save();}}const me={name:'Sen',correct:game.correct,time:Math.round(game.time),me:true},rows=[...demoRows,me];game.rank=rankOf(rows,me);const badge=game.correct===4;app.innerHTML='<div class="stack"><section class="card result-top"><img class="hat" src="'+ASSETS.hat+'" alt="Aşçı kepi"><p class="eyebrow">'+(game.rank===1?'Örnek sıralamanın birincisisin!':'Deneme tamamlandı')+'</p><div class="score">'+game.correct+' <small>/ 4 doğru</small></div><div class="pill">Örnek sıran: '+game.rank+'. / 4</div><p class="small muted">Aktif cevap süren: '+fmt(game.time)+'</p>'+(game.newBest?'<div class="celebration">'+(old?'Yeni kişisel rekor!':'İlk kişisel rekorun oluştu!')+'</div>':'<p>Kişisel rekorun: '+best.correct+' / 4</p>')+'</section><section class="card"><h2>Örnek sıralama</h2>'+rowsHTML(rows,me)+'<p class="small muted">Örnek rakipler · Doğru, sonra aktif süre. Tam eşitlikte ortak sıra.</p></section><div class="actions"><button id="review">Yanlışları tekrar et</button><button id="again" class="primary">Tekrar oyna</button></div>'+(badge?'<button id="reward" class="card reward wide">✓ Örnek başarı paketi açıldı<br><span class="small">Araç rozeti ve önlük arması →</span></button>':'<button id="reward" class="wide">Ödül örneğini incele</button>')+'</div>';$('again').onclick=start;$('review').onclick=()=>{reviewIndex=0;showReview();};$('reward').onclick=showReward;if(!restore){Sound.effect(game.rank===1?'crown':game.newBest?'record':'end');if(game.newBest)burst();}announce(game.correct+' doğru. Örnek sıralamadaki yerin '+game.rank+'.');}
function showReview(){const wrong=game.answers.map((a,i)=>({...a,q:QUESTIONS[i]})).filter(a=>!a.right);title('Tekrar et');screen='review';clearToasts();screenToken++;if(!wrong.length){app.innerHTML='<section class="card"><h1>Yanlışın yok.</h1><p>Bu denemedeki dört görseli de doğru tanıdın.</p><button id="return" class="wide primary">Sonuca dön</button></section>';$('return').onclick=renderExistingResult;return;}const a=wrong[reviewIndex],q=a.q;app.innerHTML='<div class="stack"><section class="card"><p class="eyebrow">Süresiz · Sıralamasız tekrar</p><h1>'+q.choices[q.correct]+'</h1><img style="width:100%;height:190px;object-fit:contain;background:white;border-radius:16px" src="'+q.image+'" alt="'+esc(q.choices[q.correct])+'"><p>'+esc(q.note)+'</p><p class="small muted">'+(reviewIndex+1)+' / '+wrong.length+'</p></section><button id="reviewNext" class="primary">'+(reviewIndex+1<wrong.length?'Sonraki görsel →':'Sonuca dön')+'</button></div>';$('reviewNext').onclick=()=>{if(reviewIndex+1<wrong.length){reviewIndex++;showReview();}else renderExistingResult();};}
function renderExistingResult(){finish(true);}
function showReward(){openModal('Başarı paketi örneği','<div class="line"><div class="badge" aria-hidden="true">✓</div><div><strong>Araçları Tanıyorum</strong><p class="small muted">Rozet + unvan + önlük arması</p></div></div><p>Bu yalnız ödül akışının örneğidir. Gerçek kazanma koşulu henüz tanımlanmadı.</p><button id="tryReward" class="wide primary">Dostumda dene</button>');Sound.effect('badge');$('tryReward').onclick=()=>{openModal('Arma önizlemesi','<p>Açılan arma, dostun önlüğüne takılabilecek.</p><div class="reward-preview"><div class="apron"><svg viewBox="0 0 50 50" aria-label="Çırpma teli arması"><path d="M12 10c-8 10-6 19 3 23 10 3 15-3 16-12C31 6 20 1 12 10Z M15 9c-1 12 1 19 4 23 M22 8c3 11 2 18-3 24 M19 32l10 13 M23 30l10 13"/></svg></div></div><p class="small muted">Kıyafet ve dost giydirme sistemi bu dosyada kurulmadı. Bu gösterim rütbe veya envanter kazandırmaz.</p>');};}
function openModal(t,html){returnFocus=document.activeElement;$('modalTitle').textContent=t;$('modalBody').innerHTML=html;if(!modal.open)modal.showModal();$('close').focus();if(game)game.last=performance.now();}
function closeModal(){modal.close();cancelSpeech();if(game)game.last=performance.now();returnFocus?.focus?.();}
function openSettings(sounds=false){Sound.init();openModal(sounds?'Sesleri dene':'Ayarlar', [['effects','Ses efektleri'],['music','Müzik'],['tts','Sesli okuma'],['motion','Kutlama hareketleri'],['night','Gece teması']].map(([id,t])=>'<div class="setting"><label for="p-'+id+'">'+t+'</label><input id="p-'+id+'" type="checkbox" '+(prefs[id]?'checked':'')+'></div>').join('')+'<div class="sound-test">'+[['start','Başlangıç'],['correct','Doğru'],['wrong','Yanlış'],['sword','Er Meydanı girişi'],['record','Kişisel rekor'],['crown','Birincilik'],['badge','Rozet'],['end','Tur sonu']].map(([k,t])=>'<button data-sound="'+k+'">'+t+'</button>').join('')+'</div><p class="small muted">Bu sesler önizleme için özgün olarak sentezlendi. Efektleri kapatmak müziği veya sesli okumayı kapatmaz.</p>');Object.keys(prefs).forEach(k=>{$('p-'+k).onchange=e=>{prefs[k]=e.target.checked;applyPrefs();};});$('modalBody').querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>{Sound.init();Sound.effect(b.dataset.sound);announce(b.textContent+' sesi'+(prefs.effects?' denendi.':' için ses efektlerini aç.'));});}
$('settings').onclick=()=>openSettings();$('close').onclick=closeModal;modal.addEventListener('cancel',e=>{e.preventDefault();closeModal();});$('home').onclick=()=>{if(screen==='question'||screen==='count'){openModal('Denemeden çık','<p>Bu yarım deneme rekora yazılmaz.</p><div class="actions"><button id="stay">Devam et</button><button id="leave">Ana sayfa</button></div>');$('stay').onclick=closeModal;$('leave').onclick=()=>{modal.close();showIntro();};}else showIntro();};
document.addEventListener('visibilitychange',()=>{cancelSpeech();if(game)game.last=performance.now();if(document.hidden)Sound.stop();Sound.sync();});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',applyPrefs);document.addEventListener('pointerdown',()=>Sound.init(),{once:true});
applyPrefs();showIntro();
</script></body></html>
