# Yalnız test-rekor dalında çalışır. main dalına ve canlı siteye dokunmaz.
name: Rekor kural testleri
on:
  push:
    branches: [test-rekor]
    paths-ignore: ['ci-sonuc/**']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Çalışma klasörünü hazırla
        run: |
          mkdir -p ../work/site
          rsync -a --exclude .git --exclude ci --exclude .github --exclude ci-sonuc ./ ../work/site/
          cp -r ci/firebase ../work/firebase
          cp ci/package.json ../work/package.json
      - name: Bağımlılıkları kur
        working-directory: ../work
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir -p sdk && for f in firebase-app.js firebase-auth.js firebase-firestore.js; do curl -fsSL -o sdk/$f https://www.gstatic.com/firebasejs/10.12.2/$f; done; ls -l sdk
      - name: Testleri çalıştır
        working-directory: ../work
        run: |
          set +e
          export FIREBASE_SDK_CACHE=$PWD/sdk
          mkdir -p out
          { echo "== $(date -u) commit ${GITHUB_SHA}"; 
            for t in state-tests speech-tests race-model-tests spice-info-tests ui-regression rekor-ui-tests; do echo "== $t"; node site/tests/$t.cjs; echo "exit=$?"; done;
            git -C $GITHUB_WORKSPACE fetch -q --depth 1 origin main && mkdir -p main-site && git -C $GITHUB_WORKSPACE archive FETCH_HEAD | tar -x -C main-site;
            for k in 1 2 3 4 5; do echo "== ui-regression tekrar $k (taslak)"; node site/tests/ui-regression.cjs >/tmp/u.txt 2>&1; echo "exit=$?"; grep -E "Error" /tmp/u.txt | head -2; echo "== ui-regression tekrar $k (main v14)"; node main-site/tests/ui-regression.cjs >/tmp/m.txt 2>&1; echo "exit=$?"; grep -E "Error" /tmp/m.txt | head -2; done;
            echo "== emulator: rekor-rules-tests + oda testleri (race-rules, race-ui)";
            npx firebase emulators:exec --only auth,firestore --project demo-mesleki-yaris --config firebase/firebase.json "node site/tests/rekor-rules-tests.cjs && node site/tests/run-race-integration.cjs"; echo "exit=$?";
          } > out/sonuc.txt 2>&1
          cat out/sonuc.txt
      - name: Sonucu dala yaz
        run: |
          mkdir -p ci-sonuc && cp ../work/out/sonuc.txt ci-sonuc/sonuc.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-sonuc/sonuc.txt
          git commit -m "Test sonucu ${GITHUB_SHA::7}" || true
          git push
